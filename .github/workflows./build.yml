name: build-pcan-pro

on:
  workflow_dispatch:   # Permet de lancer manuellement
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Clean project
        run: make clean

      - name: Build PCAN-PRO firmware (STM32F407)
        run: make pro

      - name: Generate BIN file
        run: |
          arm-none-eabi-objcopy -O binary build/pcan_pro.elf build/pcan_pro.bin

      - name: Upload artifact (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: pcan_pro_stm32f407_bin
          path: build/pcan_pro.bin
