name: build-pcan-pro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build PCAN-PRO firmware
        run: |
          make clean
          make pro

      - name: Generate .bin
        run: |
          arm-none-eabi-objcopy -O binary build/pcan_pro.elf build/pcan_pro.bin

      - name: Upload artifact (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: pcan_pro_stm32f407_bin
          path: build/pcan_pro.bin
